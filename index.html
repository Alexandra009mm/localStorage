<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestor de Tareas Profesional</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="card">

    <div class="fila-modo">
       Modo oscuro
      <input type="checkbox" class="toggle" id="toggleModo" />
    </div>

    <h1>Gestor de Tareas</h1>

    <p id="bienvenida"></p>

    <div class="fila-agregar">
      <input type="text" id="inputTarea" placeholder="Escriba una nueva tarea..." />
      <button id="btnAgregar">+</button>
    </div>

    <div class="filtros">
      <button data-filtro="todas" class="activo">Todas</button>
      <button data-filtro="pendientes">Pendientes</button>
      <button data-filtro="completadas">Completadas</button>
    </div>

    <div class="contadores">
      <span id="totalTexto">Total: 0</span>
      <span id="pendientesTexto"> Pendientes: 0</span>
      <span id="completadasTexto">Completadas: 0</span>
    </div>

    <ul id="listaTareas"></ul>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
